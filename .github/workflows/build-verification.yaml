name: Build verification

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Provision mock vars.nix
        run: |
          mkdir -p ~/.config/nix-config
          cat > ~/.config/nix-config/vars.nix <<'EOF'
          {
            username = "ci";
            homeDirectory = "/Users/ci";
            system = "aarch64-darwin";
            git = {
              personal = { name = "CI"; email = "ci@example.com"; };
              work = { name = "CI"; email = "ci-work@example.com"; };
            };
          }
          EOF

      - name: Build darwinConfigurations.personal.system
        run: nix build .#darwinConfigurations.personal.system --override-input vars path:$HOME/.config/nix-config/vars.nix --no-link

      - name: Build darwinConfigurations.work.system
        run: nix build .#darwinConfigurations.work.system --override-input vars path:$HOME/.config/nix-config/vars.nix --no-link
